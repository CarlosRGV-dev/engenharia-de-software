name: gestao_frota
description: "Sistema de Gestão e Monitoramento de Frota (Flutter + Firebase)."
# Impede que o pacote seja publicado no pub.dev por engano
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Firebase (banco de dados Firestore)
  firebase_core: ^5.2.0
  cloud_firestore: ^7.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
